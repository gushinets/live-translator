name: Temporary real Live cleanup verification

on:
  push:
    branches:
      - test/real-two-way-desktop

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @live-translator/web exec playwright install --with-deps chromium
      - name: Verify real harness collection
        run: pnpm --filter @live-translator/web exec playwright test --config=playwright.real.config.ts --list
      - name: Verify portrait screen contract
        run: pnpm --filter @live-translator/web exec playwright test --config=playwright.real.config.ts tests/real/orientation-harness.spec.ts
