name: Temporary two-way harness verification

on:
  push:
    branches:
      - test/real-two-way-desktop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Load and parse real-Live test module
        run: pnpm --filter @live-translator/web exec playwright test --config=playwright.real.config.ts --list
