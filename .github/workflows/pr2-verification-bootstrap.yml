# Temporary verification workspace for the PR-2 implementation. Removed before review.
name: PR2 verification workspace
on: pull_request
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'feat/identity-and-session-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export source and public dependencies only
        shell: bash
        run: |
          mkdir -p /tmp/pr2-workspace/repo /tmp/pr2-workspace/tools
          git archive HEAD | tar -x -C /tmp/pr2-workspace/repo
          cp -a node_modules /tmp/pr2-workspace/repo/
          cp -a apps/api/node_modules /tmp/pr2-workspace/repo/apps/api/
          cp -a apps/web/node_modules /tmp/pr2-workspace/repo/apps/web/
          cp "$(command -v node)" /tmp/pr2-workspace/tools/node
          cp -a /home/runner/setup-pnpm/node_modules/pnpm /tmp/pr2-workspace/tools/pnpm
          tar -czf /tmp/pr2-workspace.tar.gz -C /tmp/pr2-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: pr2-verification-workspace
          path: /tmp/pr2-workspace.tar.gz
          retention-days: 1
          compression-level: 0
