name: Temporary mobile UI visual check

on:
  push:
    branches:
      - feat/mobile-setup-ui

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @live-translator/web exec playwright install --with-deps chromium
      - name: Capture 390x844 setup
        run: |
          pnpm --filter @live-translator/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm --filter @live-translator/web exec playwright screenshot --viewport-size="390,844" --full-page http://127.0.0.1:4173 mobile-setup-390x844.png
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-setup-visual
          path: mobile-setup-390x844.png
