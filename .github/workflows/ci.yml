name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build, API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production API smoke
        env:
          NODE_ENV: production
          OPENAI_API_KEY: ci-smoke-placeholder
          WEB_ORIGIN: https://livetranslator.example.test
        run: |
          pnpm --filter @live-translator/api exec node dist/server.js > /tmp/live-translator-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/health > /tmp/live-translator-health.json; then
              cat /tmp/live-translator-health.json
              grep -q '"status":"ok"' /tmp/live-translator-health.json
              exit 0
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/live-translator-api.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/live-translator-api.log
          echo "API health check did not become ready"
          exit 1

  deployment:
    name: Validate deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ci-deployment-placeholder
      WEB_ORIGIN: https://livetranslator.example.test
      API_BIND_PORT: 13001
      WEB_BIND_PORT: 18081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Build deployment images
        run: docker compose -f infra/docker-compose.yml build

  e2e:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @live-translator/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright E2E
        run: pnpm --filter @live-translator/web exec playwright test --config=playwright.config.ts --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
