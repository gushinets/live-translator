name: live-translator

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      # '-' preserves an explicitly empty value so API validation rejects it.
      MAX_CONCURRENT_SESSIONS: "${MAX_CONCURRENT_SESSIONS-5}"
      LIVE_SESSION_LEASE_MS: "${LIVE_SESSION_LEASE_MS-900000}"
      LIVE_SESSION_RATE_LIMIT: "${LIVE_SESSION_RATE_LIMIT-20}"
      LIVE_SESSION_RATE_WINDOW_MS: "${LIVE_SESSION_RATE_WINDOW_MS-600000}"
      USAGE_LEDGER_ENABLED: "${USAGE_LEDGER_ENABLED-false}"
      BACKGROUND_SESSION_CLOSE_ENABLED: "${BACKGROUND_SESSION_CLOSE_ENABLED-false}"
      USAGE_DB_PATH: /data/live-translator.sqlite
      CONVERSATION_RETENTION_MS: "${CONVERSATION_RETENTION_MS-300000}"
      MAX_PROVIDER_SESSION_MS: "${MAX_PROVIDER_SESSION_MS-900000}"
      MAX_CONVERSATION_ELAPSED_MS: "${MAX_CONVERSATION_ELAPSED_MS-900000}"
      SESSION_CLOSE_TIMEOUT_MS: "${SESSION_CLOSE_TIMEOUT_MS-15000}"
      SESSION_HANDOFF_ACK_TIMEOUT_MS: "${SESSION_HANDOFF_ACK_TIMEOUT_MS-30000}"
      RESUME_CLAIM_TIMEOUT_MS: "${RESUME_CLAIM_TIMEOUT_MS-60000}"
      CLEANUP_WORKER_CONCURRENCY: "${CLEANUP_WORKER_CONCURRENCY-2}"
      CLEANUP_WORKER_BATCH_SIZE: "${CLEANUP_WORKER_BATCH_SIZE-20}"
      SERVER_SHUTDOWN_DRAIN_MS: "${SERVER_SHUTDOWN_DRAIN_MS-18000}"
      SERVER_SHUTDOWN_TIMEOUT_MS: "${SERVER_SHUTDOWN_TIMEOUT_MS-40000}"
    volumes:
      - usage-data:/data
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${API_BIND_PORT:-13001}:3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-18081}:8080"
    restart: unless-stopped

volumes:
  usage-data:
